name: Close issues not created from the template

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const { owner, repo } = context.repo;

            // Do not touch issues opened by the owner or collaborators
            if (['OWNER', 'MEMBER', 'COLLABORATOR'].includes(issue.author_association)) return;

            // Do not touch bug reports. Detected by label (applied by the bug form) OR by the
            // heading the bug form generates in the body, in case the label is not yet
            // present in the payload when the issue is opened.
            const labels = (issue.labels || []).map(l => (typeof l === 'string' ? l : l.name));
            const isBugReport = labels.includes('bug') || body.includes('### Describe the bug');
            if (isBugReport) {
              console.log(`Skipping: issue #${issue.number} is a bug report.`);
              return;
            }

            // The icon request form generates these headings in the body
            const valid = body.includes('### Icon name') && body.includes('### SVG code');
            if (valid) return;

            // Free-form issues (proposals, questions, discussions...) are legitimate and must stay open.
            // Close ONLY issues that look like an icon request opened without the form, judging by the
            // TITLE (conservative on purpose: a false negative costs nothing, a false positive closes
            // a legitimate issue). To disable auto-closing completely, replace this check with `return;`.
            const title = issue.title || '';
            const looksLikeIconRequest =
              /\bicon[\s-]*request\b/i.test(title) ||
              /\b(request(ing)?|add|adding|new|missing|need|needs|please add)\b[^\n]{0,40}\bicons?\b/i.test(title) ||
              /\bicons?\b[^\n]{0,40}\b(request|missing|needed)\b/i.test(title);
            if (!looksLikeIconRequest) {
              console.log(`Skipping: issue #${issue.number} does not look like an icon request.`);
              return;
            }

            const formUrl = `https://github.com/${owner}/${repo}/issues/new?template=icon_request.yml`;
            const discussionsUrl = `https://github.com/${owner}/${repo}/discussions`;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: [
                'Hi, and thanks for your interest in the project!',
                '',
                'This issue was not created with the icon request form, so it has been closed automatically.',
                '',
                `To request a new icon, please use the template here: ${formUrl}`,
                '',
                'Remember to paste the **raw SVG code** (links and images are not enough) and to read the rules at the top of the form.',
                '',
                `For anything else, please use [Discussions](${discussionsUrl}).`
              ].join('\n')
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });