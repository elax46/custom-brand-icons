name: Sync Icons to Iconfinder Branch

on:
  push:
    branches:
      - main
    paths:
      - 'dist/**' # The finder bundle is assembled from the chunks in dist/
  workflow_dispatch: # Allows manual execution from the Actions tab

jobs:
  sync-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Check out both branches: main for the pack, iconfinder for the site
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: main
          path: main

      - name: Checkout iconfinder branch
        uses: actions/checkout@v7
        with:
          ref: iconfinder
          path: iconfinder

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false # the checkouts are in subdirectories

      # 2. Refuse to publish from a dist/ that is not shippable
      - name: Verify the pack before publishing it
        working-directory: main
        run: npm run verify-dist

      # 3. Reassemble the single-file form the finder page reads
      - name: Build icon finder bundle
        run: node main/script/build-finder-bundle.mjs iconfinder/docs/custom-brand-icons.js

      # 4. Commit and Push the changes back to iconfinder branch
      - name: Commit and Push changes
        working-directory: iconfinder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/custom-brand-icons.js

          # Check if there are actual changes to commit to avoid errors
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Automated sync: update icon finder bundle from main"
            git push origin iconfinder
          fi
