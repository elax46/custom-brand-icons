name: Validate and PR new icon

on:
  issues:
    types: [opened, edited, labeled, closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process manually'
        required: true
  schedule:
    - cron: '0 0 * * *'
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v7
        with:
          ref: dev
          token: ${{ secrets.GH_PAT }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate and open PR
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER_INPUT: ${{ github.event.inputs.issue_number }}
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const invalidLabel = 'invalid-icon';
            const iconRequestLabel = 'icon request';
            const prOpenLabel = 'pr-open';

            // ---------------- Scheduled cleanup of stale invalid issues ----------------
            if (context.eventName === 'schedule') {
              const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, labels: invalidLabel, state: 'open' });
              for (const issue of issues) {
                const threshold = 7 * 24 * 60 * 60 * 1000;
                const lastUpdate = new Date(issue.updated_at).getTime();
                if ((Date.now() - lastUpdate) > threshold) {
                  await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: issue.number,
                    body: "This issue has been closed due to inactivity."
                  });
                }
              }
              return;
            }
            // -----------------------------------------------------------------------

            // ---------------- Close linked PR when issue is marked invalid or closed ----------------
            if (context.eventName === 'issues' && (context.payload.action === 'labeled' || context.payload.action === 'closed')) {
              const issue_number = context.issue.number;

              let shouldClose = false;
              let reason = '';

              if (context.payload.action === 'labeled') {
                const labelName = context.payload.label?.name;
                if (labelName !== invalidLabel) {
                  return; // not the label we care about
                }
                shouldClose = true;
                reason = `was manually marked with the \`${invalidLabel}\` label`;
              } else if (context.payload.action === 'closed') {
                shouldClose = true;
                reason = 'was closed';
              }

              if (!shouldClose) return;

              // Find PR(s) linked to this issue via GitHub's own cross-reference
              // timeline (populated automatically from "Closes #N" in the PR body —
              // the same mechanism behind the "Linked pull requests" UI).
              const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner, repo, issue_number, per_page: 100
              });

              const linkedPRs = new Set();
              for (const event of timeline) {
                if (
                  event.event === 'cross-referenced' &&
                  event.source?.issue?.pull_request &&
                  event.source.issue.repository?.full_name === `${owner}/${repo}`
                ) {
                  linkedPRs.add(event.source.issue.number);
                }
              }

              if (linkedPRs.size === 0) {
                console.log(`Nessuna PR collegata trovata per la issue #${issue_number}.`);
                return;
              }

              for (const pr_number of linkedPRs) {
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pr_number });
                if (pr.state !== 'open') continue;

                await github.rest.pulls.update({ owner, repo, pull_number: pr_number, state: 'closed' });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr_number,
                  body: `🔒 This PR was automatically closed because the linked issue #${issue_number} ${reason}.`
                });
              }

              return;
            }
            // -----------------------------------------------------------------------

            let issue_number, issue;
            if (context.eventName === 'workflow_dispatch') {
              issue_number = parseInt(process.env.ISSUE_NUMBER_INPUT, 10);
              const { data } = await github.rest.issues.get({ owner, repo, issue_number });
              issue = data;
            } else {
              issue_number = context.issue.number;
              issue = context.payload.issue;
            }

            // Only run on issues opened via the "Insert new icon" form (identified by its label)
            const labels = (issue.labels || []).map(l => (typeof l === 'string' ? l : l.name));
            if (!labels.includes(iconRequestLabel)) {
              console.log(`Skipping: issue #${issue_number} does not have the "${iconRequestLabel}" label.`);
              return;
            }

            // If a PR has already been opened for this issue, skip re-processing
            if (labels.includes(prOpenLabel)) {
              console.log(`Skipping: issue #${issue_number} already has an open PR.`);
              return;
            }

            const body = issue.body || '';

            // Extract icon name from the form field
            const nameMatch = body.match(/###\s*Icon name\s*\n+([^\n#]+)/i);
            let iconName = nameMatch ? nameMatch[1].trim() : null;
            if (iconName) {
              iconName = iconName.toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '');
            }

            // Extract the SVG pasted in the "SVG code" form field (fenced ```xml block)
            const fencedMatch = body.match(/```(?:xml|svg)?\s*\n([\s\S]*?)```/i);
            let svgContent = fencedMatch ? fencedMatch[1].trim() : null;
            if (!svgContent) {
              const rawMatch = body.match(/<svg[\s\S]*?<\/svg>/i);
              svgContent = rawMatch ? rawMatch[0] : null;
            }

            if (!iconName || !svgContent) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [invalidLabel] }).catch(() => {});
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: "⚠️ **Validation Failed:** Missing icon name or SVG code. Please fill in the form fields correctly — paste the raw SVG code, do not attach an image file."
              });
              return;
            }

            // ---------------- Structural validation ----------------
            const problems = [];
            if (!/viewBox/i.test(svgContent)) problems.push('Missing `viewBox` attribute.');
            if (/\b(transform|translate|scale)\s*[:(]/i.test(svgContent)) problems.push('Found `transform`/`translate`/`scale`, which is not allowed.');
            const pathCount = (svgContent.match(/<path\b/gi) || []).length;
            if (pathCount === 0) problems.push('No `<path>` element found.');
            if (pathCount > 1) problems.push(`Found ${pathCount} \`<path>\` elements, only one is allowed.`);
            if (!/#44739e/i.test(svgContent)) problems.push('Color `#44739e` not found.');

            if (problems.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [invalidLabel] }).catch(() => {});
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: "⚠️ **Validation Failed:** The SVG does not meet the requirements:\n\n" +
                      problems.map(p => `- ${p}`).join('\n')
              });
              return;
            }

            // ---------------- Duplicate check (icon-svg folder on dev + live bundle on main) ----------------
            const targetPath = path.join('icon-svg', `${iconName}.svg`);
            if (fs.existsSync(targetPath)) {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `⚠️ An icon named \`${iconName}\` already exists in the library (icon-svg/${iconName}.svg). If this is a different icon, please choose a different name.`
              });
              return;
            }

            try {
              const { data: distFile } = await github.rest.repos.getContent({
                owner, repo,
                path: 'dist/custom-brand-icons.js',
                ref: 'main'
              });
              const distContent = Buffer.from(distFile.content, 'base64').toString('utf8');
              const escaped = iconName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const keyRegex = new RegExp(`["'\`]${escaped}["'\`]\\s*:`, 'i');
              if (keyRegex.test(distContent)) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number,
                  body: `⚠️ An icon named \`${iconName}\` already exists in the published icon pack (dist/custom-brand-icons.js on main), possibly as an alias. If this is a different icon, please choose a different name.`
                });
                return;
              }
            } catch (error) {
              console.log(`Could not check dist bundle on main: ${error.message}`);
              // Non-blocking: if the API call fails (rate limit, file missing, etc.), continue with the icon-svg check only.
            }

            // ---------------- Create branch, commit, push, open PR ----------------
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: invalidLabel }).catch(() => {});

              const branchName = `icon-request/${iconName}-${issue_number}`;
              fs.mkdirSync('icon-svg', { recursive: true });
              fs.writeFileSync(targetPath, svgContent, 'utf8');

              execSync(`git checkout -b ${branchName}`);
              execSync(`git add ${targetPath}`);
              execSync(`git commit -m "Add icon: ${iconName} (closes #${issue_number})"`);
              execSync(`git push origin ${branchName}`);

              const { data: pr } = await github.rest.pulls.create({
                owner, repo,
                title: `Add icon: ${iconName}`,
                head: branchName,
                base: 'dev',
                body: `Automatically generated from #${issue_number}.\n\nCloses #${issue_number}.`
              });

              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [prOpenLabel] }).catch(() => {});
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `✅ **Validation Successful:** PR #${pr.number} has been opened for review: ${pr.html_url}\n\nIt will be automatically normalized once the PR is processed.`
              });
            } catch (error) {
              console.error("Error:", error.message);

              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [invalidLabel] }).catch(() => {});

              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `⚠️ **Failed to open PR.**\n\nDetails: ${error.message}`
              });
            }