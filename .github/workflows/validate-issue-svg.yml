name: Validate and Normalize Attached SVG

on:
  issues:
    types: [opened, edited]
  schedule:
    - cron: '0 0 * * *'
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Validate and Normalize
        uses: actions/github-script@v9
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const invalidLabel = 'invalid-icon';
            const iconRequestLabel = 'icon request';

            // ---------------- Scheduled cleanup of stale invalid issues ----------------
            if (context.eventName === 'schedule') {
              const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, labels: invalidLabel, state: 'open' });
              for (const issue of issues) {
                const threshold = 7 * 24 * 60 * 60 * 1000;
                const lastUpdate = new Date(issue.updated_at).getTime();
                if ((Date.now() - lastUpdate) > threshold) {
                  await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: issue.number,
                    body: "This issue has been closed due to inactivity."
                  });
                }
              }
              return;
            }
            // -----------------------------------------------------------------------

            const issue_number = context.issue.number;
            const issue = context.payload.issue;

            // Only run on issues opened via the "Insert new icon" form (identified by its label)
            const labels = (issue.labels || []).map(l => (typeof l === 'string' ? l : l.name));
            if (!labels.includes(iconRequestLabel)) {
              console.log(`Skipping: issue #${issue_number} does not have the "${iconRequestLabel}" label.`);
              return;
            }

            const body = issue.body || '';

            // Extract the SVG pasted in the "SVG code" form field (fenced ```xml block)
            const fencedMatch = body.match(/```(?:xml|svg)?\s*\n([\s\S]*?)```/i);
            let svgContent = fencedMatch ? fencedMatch[1].trim() : null;

            // Fallback: raw <svg>...</svg> without fences
            if (!svgContent) {
              const rawMatch = body.match(/<svg[\s\S]*?<\/svg>/i);
              svgContent = rawMatch ? rawMatch[0] : null;
            }

            if (!svgContent) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [invalidLabel] }).catch(() => {});
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: "⚠️ **Validation Failed:** No SVG code was found in the issue body. Please paste the raw SVG code in the dedicated field — do not attach an image file."
              });
              return;
            }

            const stageDir = path.join(process.env.RUNNER_TEMP, 'icon_stage');
            if (fs.existsSync(stageDir)) fs.rmSync(stageDir, { recursive: true });
            fs.mkdirSync(stageDir, { recursive: true });

            const filePath = path.join(stageDir, 'icon.svg');
            fs.writeFileSync(filePath, svgContent, 'utf8');

            try {
              const stdout = execSync(`node script/normalize-icons.mjs "${stageDir}" "${stageDir}" --clean`, { encoding: 'utf8' });
              console.log("Script output:", stdout);

              const stats = fs.statSync(filePath);
              if (stats.size === 0) throw new Error("Normalization resulted in an empty file.");

              const { data: existingComments } = await github.rest.issues.listComments({ owner, repo, issue_number });
              const hasSuccess = existingComments.some(c => c.body.includes("✅ **Validation Successful"));

              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: invalidLabel }).catch(() => {});

              if (!hasSuccess) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number,
                  body: "✅ **Validation Successful:** The SVG has been normalized and is ready to be included."
                });
              }
            } catch (error) {
              console.error("Normalization Error:", error.message);

              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [invalidLabel] }).catch(() => {});

              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `⚠️ **Validation Failed:** The icon is invalid or could not be normalized.\n\nDetails: ${error.message}`
              });
            }